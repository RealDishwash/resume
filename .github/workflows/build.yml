name: Build, Commit, and Publish Resume PDF
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Typst
        uses: typst-community/setup-typst@v4
      - name: Compile PDF
        run: typst compile main.typ Vishwas_Parpattegar_24766178_Resume.pdf
      - name: Commit updated PDF
        run: |
          if [ -z "$(git status --porcelain -- Vishwas_Parpattegar_24766178_Resume.pdf)" ]; then
            echo "No PDF changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Vishwas_Parpattegar_24766178_Resume.pdf
            git commit -m "chore: update Vishwas_Parpattegar_24766178_Resume.pdf [skip ci]"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp Vishwas_Parpattegar_24766178_Resume.pdf dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
