name: Build and Commit Resume PDF
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Typst
        uses: typst-community/setup-typst@v4
      - name: Compile PDF
        run: typst compile main.typ resume.pdf
      - name: Commit updated PDF
        run: |
          if git diff --quiet -- resume.pdf; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          git commit -m "chore: update resume.pdf [skip ci]"
          git push
