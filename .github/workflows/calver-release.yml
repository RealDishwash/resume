name: Tag CalVer release on push
on:
  push:
    branches:
      - main

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute CalVer tag
        run: echo "CALVER=v$(date -u '+%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

      - name: Create tag
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "$CALVER" -m "Release $CALVER"
          git push origin "$CALVER"

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.CALVER }}
          name: Release ${{ env.CALVER }}
          generate_release_notes: true
